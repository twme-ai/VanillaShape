plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

def targetMinecraft = providers.gradleProperty('minecraft_version').getOrElse('26.2')

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

repositories {
    maven { url = 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation project(':common')
    include project(':common')
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'com.github.Moulberry:AxiomClientAPI:v2.0.1'
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', targetMinecraft
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: targetMinecraft }
}

base { archivesName = "vanillashape-fabric-${targetMinecraft}" }

jar {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_VanillaShape" } }
}
