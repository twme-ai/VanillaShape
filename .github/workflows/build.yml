name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build every supported Minecraft version
        run: |
          ./gradlew clean
          ./scripts/build-matrix.sh all
      - name: Verify metadata, bytecode and bundled dependencies
        run: ./scripts/verify-artifacts.sh
      - uses: actions/upload-artifact@v7
        with:
          name: VanillaShape-${{ github.sha }}
          path: dist/
