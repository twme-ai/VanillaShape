plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

sourceSets {
    faweApi { java.srcDir 'src/faweApi/java' }
}

dependencies {
    implementation project(':common')
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.119-stable'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.5'
    compileOnly sourceSets.faweApi.output
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.119-stable'
    testImplementation 'com.sk89q.worldedit:worldedit-core:7.4.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') { dependsOn tasks.named('compileFaweApiJava') }

tasks.named('test') { useJUnitPlatform() }

tasks.named('shadowJar') {
    archiveClassifier = ''
    relocate 'org.sqlite', 'dev.twme.vanillashape.libs.sqlite'
    mergeServiceFiles()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }
